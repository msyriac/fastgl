[build-system]
# Build-time only: meson-python (the backend) and pybind11 (headers compiled
# into the extension). Do NOT list `build` or `pytest` here -- they are not
# build requirements and only slow down every isolated build.
requires = ["meson-python>=0.15", "pybind11>=2.11"]
build-backend = "mesonpy"

[project]
name = "fastgl"
version = "0.1.12"
description = "Python bindings for the Fast Gauss-Legendre (FastGL) algorithm"
authors = [{name = "Mathew Madhavacheril", email = "mathewsyriac@gmail.com"}]
readme = "README.rst"
license = {text = "MIT"}
requires-python = ">=3.10"

# Runtime dependencies only. pybind11 is header-only and compiled into
# _fastgl -- it is never needed at runtime, so it must not appear here
# (it breaks --no-index installs and forces every user to download it).
# numpy IS needed at runtime because the bindings return numpy arrays.
dependencies = [
     "numpy"
     ]

[project.optional-dependencies]
test = [
    'scipy>=1.0',
    'pytest-cov>=2.6',
    'coveralls>=1.5',
    'pytest>=4.6',
    'numpy'
]


[project.urls]
Homepage = "https://github.com/msyriac/fastgl"
